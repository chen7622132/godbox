cus{outline:1px solid var(--gold-dim)}.race-pick{display:flex;gap:6px;flex-wrap:wrap}.race-chip{border:1px solid var(--line);padding:4px 9px;font-size:11.5px;cursor:pointer;background:#0f151d;display:flex;align-items:center;gap:5px}.race-chip .dot{width:8px;height:8px;display:inline-block}.race-chip.on{border-color:currentColor;background:#ffd44714}.btn-primary{appearance:none;width:100%;margin-top:18px;background:var(--gold);color:#10151c;border:0;padding:11px;font:inherit;font-size:13px;font-weight:800;letter-spacing:.2em;cursor:pointer;border-radius:0}.btn-primary:hover{background:#ffdf72}.btn-row{display:flex;gap:8px}.btn-row .btn-primary{margin-top:12px;flex:1}.btn-ghost{appearance:none;margin-top:12px;background:transparent;border:1px solid var(--line);color:var(--dim);font:inherit;font-size:12px;padding:11px 16px;cursor:pointer;border-radius:0}.btn-ghost:hover{color:var(--text);border-color:#3c4c62}.hintline{color:var(--dim);font-size:11px;line-height:1.7;margin:8px 0 0}.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin-bottom:4px}.stat-cell{background:#0c1118;padding:9px 11px}.stat-cell .k{color:var(--dim);font-size:10px;letter-spacing:.1em}.stat-cell .v{color:var(--gold);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}.hist{display:flex;align-items:flex-end;gap:1px;height:56px;border-bottom:1px solid var(--line);padding-bottom:1px;margin-top:6px}.hist i{flex:1;background:var(--gold-dim);min-height:1px;display:block}.verdict{border:1px solid var(--gold-dim);background:#ffd4470f;padding:10px 12px;font-size:12px;line-height:1.7;color:#e8dfc4}@media (max-width: 860px){#toolbar{width:60px}.tool-btn .t-label{display:none}.tool-btn{justify-content:center}#chronicle{width:min(72vw,300px);top:50px;bottom:8px}#races{left:76px;flex-wrap:wrap;gap:4px}.race-card{min-width:78px;padding:4px 7px}#inspector{left:76px;width:min(78vw,290px </style>
  </head>
  <body>
    <div id="app">
      <!-- 画布 -->
      <canvas id="world"></canvas>

      <!-- 顶部状态条 -->
      <header id="hud">
        <div class="hud-left">
          <span class="brand">GodBox</span>
          <span id="hud-year" title="世界纪年">第 0 年</span>
          <span id="hud-pop" title="总人口">人口 0</span>
          <span id="hud-nations" title="国家数">国家 0</span>
        </div>
        <div class="hud-right">
          <button id="btn-speed" class="hud-btn" title="空格：暂停/继续">▶ 1x</button>
          <button id="btn-save" class="hud-btn" title="存档到浏览器">存档</button>
          <button id="btn-load" class="hud-btn" title="读取浏览器存档">读档</button>
          <button id="btn-export" class="hud-btn" title="导出存档文件">导出</button>
          <button id="btn-end" class="hud-btn danger" title="立即结算本局">结算</button>
        </div>
      </header>

      <!-- 左侧：神迹工具栏 -->
      <nav id="toolbar" aria-label="神迹工具"></nav>

      <!-- 右侧：编年史 -->
      <aside id="chronicle">
        <div class="panel-head">
          <span>世界编年史</span>
          <span style="display:flex;gap:4px;align-items:center">
            <button id="btn-chron-filter" class="mini" style="width:auto;padding:0 6px" title="只显示建国/战争/灾难等大事">大事</button>
            <button id="btn-chron-toggle" class="mini" title="收起/展开">—</button>
          </span>
        </div>
        <ol id="chronicle-list"></ol>
      </aside>

      <!-- 左下：选中信息 -->
      <section id="inspector" hidden></section>

      <!-- 右下：种族战报 -->
      <section id="races"></section>

      <!-- 提示条 -->
      <div id="toast"></div>

      <!-- 创世 / 结算遮罩 -->
      <div id="overlay" class="overlay"></div>
    </div>
  </body>
</html>
