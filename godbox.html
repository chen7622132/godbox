lbar-width:thin}#toolbar::-webkit-scrollbar{width:4px}#toolbar::-webkit-scrollbar-thumb{background:#2c3848}.tool-group-title{font-size:9px;color:var(--dim);letter-spacing:.18em;padding:6px 4px 3px;border-top:1px solid var(--line-soft);margin-top:4px}.tool-group-title:first-child{border-top:0;margin-top:0}.tool-btn{display:flex;align-items:center;gap:6px;width:100%;padding:5px;background:transparent;border:1px solid transparent;color:var(--text);font:inherit;font-size:11px;cursor:pointer;text-align:left;border-radius:0}.tool-btn:hover{background:#1a2330;border-color:#2e3b4d}.tool-btn.active{background:#2a2410;border-color:var(--gold);color:var(--gold)}.tool-btn.active .t-glyph{background:var(--gold);color:#12161d}.tool-btn.danger .t-glyph{color:#e07a63}.t-btn.active{background:#2a1410;border-color:var(--danger);color:#ffb3a4}.t-glyph{flex:0 0 20px;height:20px;display:grid;place-items:center;background:#1b2431;border:1px solid var(--line);font-size:12px;line-height:1}.t-label{font-size:11px;letter-spacing:.02em}#chronicle{position:absolute;right:8px;top:52px;bottom:8px;width:320px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);z-index:15;transition:transform .18s ease,opacity .18s}#chronicle.collapsed{transform:translate(calc(100% - 30px));opacity:.96}#chronicle.collapsed #chronicle-list{opacity:0}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.14em;color:var(--dim);flex:0 0 auto}.mini{background:transparent;border:1px solid var(--line);color:var(--dim);font:inherit;font-size:11px;width:20px;height:18px;cursor:pointer;line-height:1;padding:0}.mini:hover{color:var(--text);border-color:#3c4c62}#chronicle-list{list-style:none;margin:0;padding:4px 0 8px;overflow-y:auto;flex:1 1 auto;font-size:11.5px;line-height:1.55;scrollbar-width:thin;transition:opacity .15s}#chronicle-list::-webkit-scrollbar{width:5px}#chronicle-list::-webkit-scrollbar-thumb{background:#2c3848}#chronicle-list li{padding:3px 10px;border-left:2px solid transparent;color:#b9c4d4;animation:evIn .25s ease}@keyframes evIn{0%{opacity:0;transform:translate(6px);background:#ffd4471a}to{opacity:1;transform:none}}#chronicle-list li .yr{color:var(--gold-dim);font-size:10px;margin-right:6px;letter-spacing:.04em}#chronicle-list li.lv2{color:#f0e6cf;font-weight:600}#chronicle-list li.k-war{border-left-color:#d9483a}#chronicle-list li.k-conquer{border-left-color:#ff5a3c;background:#d9483a14}#chronicle-list li.k-nation{border-left-color:var(--gold)}#chronicle-list li.k-unify{border-left-color:#ffe89a;background:#ffd4471f}#chronicle-list li.k-disaster,#chronicle-list li.k-plague{border-left-color:#a35ad9}#chronicle-list li.k-extinct{border-left-color:#6a6a6a;color:#8e9096;font-style:italic}#chronicle-list li.k-tech{border-left-color:#5aa9d9}#chronicle-list li.k-gift{border-left-color:#7fd07f}#chronicle-list li.k-ruin{border-left-color:#8a7a5a}#inspector{position:absolute;left:96px;bottom:8px;width:290px;max-height:46vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--gold);padding:9px 11px;font-size:11.5px;line-height:1.6;z-index:16;scrollbar-width:thin}#inspector h3{margin:0 0 6px;font-size:13px;color:var(--gold);letter-spacing:.04em}#inspector .row{display:flex;justify-content:space-between;gap:8px}#inspector .row span:first-child{color:var(--dim)}#inspector .row span:last-child{color:var(--text);font-variant-numeric:tabular-nums}#inspector .sep{height:1px;background:var(--line-soft);margin:7px 0}#inspector .tag{display:inline-block;padding:0 5px;border:1px solid currentColor;font-size:10px;margin-right:4px}#inspector .close{position:absolute;top:6px;right:6px}#races{position:absolute;left:96px;bottom:8px;display:flex;gap:6px;z-index:14;pointer-events:none}#inspector:not([hidden])~#races{display:none}.race-card{background:var(--panel);border:1px solid var(--line);border-top:2px solid currentColor;padding:5px 9px 6px;min-width:92px;font-size:11px;line-height:1.5}.race-card .rn{font-weight:700;font-size:11.5px;letter-spacing:.04em}.race-card .rp{color:var(--dim);font-variant-numeric:tabular-nums}.race-card .rp b{color:var(--text);font-weight:600}#toast{position:absolute;left:50%;bottom:76px;transform:translate(-50%) translateY(10px);background:#0a0e14f2;border:1px solid var(--gold-dim);color:var(--gold);padding:6px 14px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;white-space:nowrap}#toast.show{opacity:1;transform:translate(-50%) translateY(0)}.overlay{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#121a26,#06090d 75%);z-index:60;display:none;overflow-y:auto;padding:24px 16px}.overlay.show{display:block}.sheet{max-width:640px;margin:0 auto;background:var(--panel-solid);border:1px solid var(--line);padding:20px 22px 22px}.sheet h1{margin:0 0 2px;font-size:22px;letter-spacing:.22em;color:var(--gold);font-weight:800}.sheet .sub{color:var(--dim);font-size:11.5px;letter-spacing:.06em;margin-bottom:16px}.sheet h2{font-size:11px;letter-spacing:.16em;color:var(--dim);margin:16px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--line-soft);font-weight:600}.field-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12px}.field-row>label{flex:0 0 76px;color:var(--dim);font-size:11.5px}.seg{display:flex;gap:0;flex-wrap:wrap}.seg button{appearance:none;background:#131a24;border:1px solid var(--line);color:var(--text);font:inherit;font-size:11.5px;padding:5px 11px;cursor:pointer;border-radius:0;margin-right:-1px}.seg button:hover{background:#1d2735}.seg button.on{background:var(--gold);color:#10151c;border-color:var(--gold);font-weight:700;z-index:1}input[type=range]{flex:1;accent-color:var(--gold);height:3px;background:#232f3f;appearance:none}input[type=range]::-webkit-slider-thumb{appearance:none;width:12px;height:12px;background:var(--gold);border:0;cursor:pointer}.range-val{flex:0 0 34px;text-align:right;color:var(--gold);font-size:11px}input[type=text],input[type=number]{background:#0a0f15;border:1px solid var(--line);color:var(--text);font:inherit;font-size:12px;padding:5px 8px;border-radius:0;width:130px}input[type=text]:focus,input[type=number]:focus{outline:1px solid var(--gold-dim)}.race-pick{display:flex;gap:6px;flex-wrap:wrap}.race-chip{border:1px solid var(--line);padding:4px 9px;font-size:11.5px;cursor:pointer;background:#0f151d;display:flex;align-items:center;gap:5px}.race-chip .dot{width:8px;height:8px;display:inline-block}.race-chip.on{border-color:currentColor;background:#ffd44714}.btn-primary{appearance:none;width:100%;margin-top:18px;background:var(--gold);color:#10151c;border:0;padding:11px;font:inherit;font-size:13px;font-weight:800;letter-spacing:.2em;cursor:pointer;border-radius:0}.btn-primary:hover{background:#ffdf72}.btn-row{display:flex;gap:8px}.btn-row .btn-primary{margin-top:12px;flex:1}.btn-ghost{appearance:none;margin-top:12px;background:transparent;border:1px solid var(--line);color:var(--dim);font:inherit;font-size:12px;padding:11px 16px;cursor:pointer;border-radius:0}.btn-ghost:hover{color:var(--text);border-color:#3c4c62}.hintline{color:var(--dim);font-size:11px;line-height:1.7;margin:8px 0 0}.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin-bottom:4px}.stat-cell{background:#0c1118;padding:9px 11px}.stat-cell .k{color:var(--dim);font-size:10px;letter-spacing:.1em}.stat-cell .v{color:var(--gold);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}.hist{display:flex;align-items:flex-end;gap:1px;height:56px;border-bottom:1px solid var(--line);padding-bottom:1px;margin-top:6px}.hist i{flex:1;background:var(--gold-dim);min-height:1px;display:block}.verdict{border:1px solid var(--gold-dim);background:#ffd4470f;padding:10px 12px;font-size:12px;line-height:1.7;color:#e8dfc4}@media (max-width: 860px){#toolbar{width:60px}.tool-btn .t-label{display:none}.tool-btn{justify-content:center}#chronicle{width:min(72vw,300px);top:50px;bottom:8px}#races{left:76px;flex-wrap:wrap;gap:4px}.race-card{min-width:78px;padding:4px 7px}#inspector{left:76px;width:min(78vw,290px)}.hud-left>span:not(.brand):not(#hud-year){display:none}.sheet{padding:16px 14px 18px}.field-row>label{flex:0 0 62px}#toast{bottom:100px;font-size:11px}}

</style>
  </head>
  <body>
    <div id="app">
      <!-- 画布 -->
      <canvas id="world"></canvas>

      <!-- 顶部状态条 -->
      <header id="hud">
        <div class="hud-left">
          <span class="brand">GodBox</span>
          <span id="hud-year" title="世界纪年">第 0 年</span>
          <span id="hud-pop" title="总人口">人口 0</span>
          <span id="hud-nations" title="国家数">国家 0</span>
        </div>
        <div class="hud-right">
          <button id="btn-speed" class="hud-btn" title="空格：暂停/继续">▶ 1x</button>
          <button id="btn-save" class="hud-btn" title="存档到浏览器">存档</button>
          <button id="btn-load" class="hud-btn" title="读取浏览器存档">读档</button>
          <button id="btn-export" class="hud-btn" title="导出存档文件">导出</button>
          <button id="btn-end" class="hud-btn danger" title="立即结算本局">结算</button>
        </div>
      </header>

      <!-- 左侧：神迹工具栏 -->
      <nav id="toolbar" aria-label="神迹工具"></nav>

      <!-- 右侧：编年史 -->
      <aside id="chronicle">
        <div class="panel-head">
          <span>世界编年史</span>
          <span style="display:flex;gap:4px;align-items:center">
            <button id="btn-chron-filter" class="mini" style="width:auto;padding:0 6px" title="只显示建国/战争/灾难等大事">大事</button>
            <button id="btn-chron-toggle" class="mini" title="收起/展开">—</button>
          </span>
        </div>
        <ol id="chronicle-list"></ol>
      </aside>

      <!-- 左下：选中信息 -->
      <section id="inspector" hidden></section>

      <!-- 右下：种族战报 -->
      <section id="races"></section>

      <!-- 提示条 -->
      <div id="toast"></div>

      <!-- 创世 / 结算遮罩 -->
      <div id="overlay" class="overlay"></div>
    </div>
  </body>
</html>
